<!doctype html>
<html lang="en" data-theme="vibrant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- Icons (the brain mascot everywhere — tab, install, pinned tab) -->
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon-32.png"
      sizes="32x32"
      type="image/png"
    />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    <link
      rel="mask-icon"
      href="%sveltekit.assets%/favicon.svg"
      color="#9333ea"
    />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

    <!-- Primary meta -->
    <title>DrShrink — drop a file, get a smaller one</title>
    <meta name="author" content="Pablo" />
    <meta name="application-name" content="DrShrink" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f3e8ff" />
    <link rel="canonical" href="https://drshrink.app/" />
    <meta
      name="description"
      content="Drop a file in, get a smaller one out. DrShrink shrinks images, files, batches, text, docs and audio the 80/20 way — no settings, no uploads, 100% in your browser."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DrShrink" />
    <meta
      property="og:title"
      content="DrShrink — drop a file, get a smaller one"
    />
    <meta
      property="og:description"
      content="Shrink images, files, batches, text, docs and audio the 80/20 way. No settings, no uploads, 100% in your browser."
    />
    <meta property="og:url" content="https://drshrink.app/" />
    <meta property="og:image" content="https://drshrink.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="DrShrink — drop a file, get a smaller one"
    />
    <meta
      name="twitter:description"
      content="Shrink anything the 80/20 way. No settings, no uploads, 100% in your browser."
    />
    <meta name="twitter:image" content="https://drshrink.app/og-image.png" />

    %sveltekit.head%
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/splash/apple-splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/splash/apple-splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/splash/apple-splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/splash/apple-splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<script defer src="https://fleetcount.pibulus.deno.net/beacon.js" data-site="drshrink-netlify.netlify.app"></script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
