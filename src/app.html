<!doctype html>
<html lang="en" data-theme="vibrant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- Icons -->
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

    <!-- Primary meta -->
    <title>DrShrink — drop a file, get a smaller one</title>
    <meta name="author" content="Pablo" />
    <meta name="application-name" content="DrShrink" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f3e8ff" />
    <link rel="canonical" href="https://drshrink.app/" />
    <meta
      name="description"
      content="Drop a file in, get a smaller one out. DrShrink shrinks images, files, batches, text, docs and audio the 80/20 way — no settings, no uploads, 100% in your browser."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DrShrink" />
    <meta property="og:title" content="DrShrink — drop a file, get a smaller one" />
    <meta
      property="og:description"
      content="Shrink images, files, batches, text, docs and audio the 80/20 way. No settings, no uploads, 100% in your browser."
    />
    <meta property="og:url" content="https://drshrink.app/" />
    <meta property="og:image" content="https://drshrink.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DrShrink — drop a file, get a smaller one" />
    <meta
      name="twitter:description"
      content="Shrink anything the 80/20 way. No settings, no uploads, 100% in your browser."
    />
    <meta name="twitter:image" content="https://drshrink.app/og-image.png" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
